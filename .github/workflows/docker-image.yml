name: Build and publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stashvideohashernode"
          year="$(date -u +%Y)"
          year_month="$(date -u +%Y.%m)"
          year_month_day="$(date -u +%Y.%m.%d)"

          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"

          tags=(
            "${image}:latest"
            "${image}:${year}"
            "${image}:${year_month}"
            "${image}:${year_month_day}"
            "${image}:${version}"
          )

          if [[ "${version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            tags+=(
              "${image}:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              "${image}:${BASH_REMATCH[1]}"
            )
          fi

          {
            echo "image=${image}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: |
            type=gha,scope=stashvideohashernode
            type=registry,ref=${{ steps.tags.outputs.image }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=stashvideohashernode
            type=registry,ref=${{ steps.tags.outputs.image }}:buildcache,mode=max
