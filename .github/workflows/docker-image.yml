name: Build and publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  detect-version-change:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.detect.outputs.version_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Detect version change
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          before_sha="${{ github.event.before }}"
          zero_sha="0000000000000000000000000000000000000000"

          if [[ "${before_sha}" == "${zero_sha}" ]]; then
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! git show "${before_sha}:pyproject.toml" > /tmp/pyproject.old 2>/dev/null; then
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          cp pyproject.toml /tmp/pyproject.new
          equal_line="$(python scripts/version_utils.py equal --old-file /tmp/pyproject.old --new-file /tmp/pyproject.new)"

          if [[ "${equal_line}" == "equal=true" ]]; then
            echo "version_changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
          fi

  build-and-push:
    needs: detect-version-change
    if: github.event_name == 'workflow_dispatch' || needs.detect-version-change.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Ensure lockfile matches pyproject
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check || uv lock

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stashvideohashernode"
          year="$(date -u +%Y)"
          year_month="$(date -u +%Y.%m)"
          year_month_day="$(date -u +%Y.%m.%d)"

          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"

          tags=(
            "${image}:latest"
            "${image}:${year}"
            "${image}:${year_month}"
            "${image}:${year_month_day}"
            "${image}:${version}"
          )

          if [[ "${version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            tags+=(
              "${image}:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              "${image}:${BASH_REMATCH[1]}"
            )
          fi

          {
            echo "image=${image}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
