name: Release pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      publish_release: ${{ steps.finalize.outputs.publish_release }}
      target_ref: ${{ steps.finalize.outputs.target_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Detect version-change state
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
            echo "should_bump=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          before_sha="${{ github.event.before }}"
          zero_sha="0000000000000000000000000000000000000000"

          if [[ "${before_sha}" == "${zero_sha}" ]]; then
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
            echo "should_bump=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! git show "${before_sha}:pyproject.toml" > /tmp/pyproject.old 2>/dev/null; then
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
            echo "should_bump=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          cp pyproject.toml /tmp/pyproject.new
          equal_line="$(python scripts/version_utils.py equal --old-file /tmp/pyproject.old --new-file /tmp/pyproject.new)"

          if [[ "${equal_line}" == "equal=true" ]]; then
            echo "version_changed=false" >> "${GITHUB_OUTPUT}"
            echo "should_bump=true" >> "${GITHUB_OUTPUT}"
          else
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
            echo "should_bump=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Bump patch version
        if: steps.detect.outputs.should_bump == 'true' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/version_utils.py bump-patch --file pyproject.toml

      - name: Commit and push bump
        if: steps.detect.outputs.should_bump == 'true' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail

          new_version="$(python - <<'PY'
          from pathlib import Path
          from scripts.version_utils import extract_project_version
          print(extract_project_version(Path("pyproject.toml").read_text(encoding="utf-8")))
          PY
          )"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${new_version}"
          git push origin main

      - name: Finalize release outputs
        id: finalize
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.detect.outputs.should_bump }}" == "true" && "${{ github.actor }}" != "github-actions[bot]" ]]; then
            echo "publish_release=true" >> "${GITHUB_OUTPUT}"
            echo "target_ref=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          else
            echo "publish_release=${{ steps.detect.outputs.version_changed }}" >> "${GITHUB_OUTPUT}"
            echo "target_ref=${{ github.sha }}" >> "${GITHUB_OUTPUT}"
          fi

  docker:
    needs: version
    if: github.event_name == 'workflow_dispatch' || needs.version.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.version.outputs.target_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stashvideohashernode"
          year="$(date -u +%Y)"
          year_month="$(date -u +%Y.%m)"
          year_month_day="$(date -u +%Y.%m.%d)"

          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"

          tags=(
            "${image}:latest"
            "${image}:${year}"
            "${image}:${year_month}"
            "${image}:${year_month_day}"
            "${image}:${version}"
          )

          if [[ "${version}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            tags+=(
              "${image}:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              "${image}:${BASH_REMATCH[1]}"
            )
          fi

          {
            echo "image=${image}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: |
            type=gha,scope=stashvideohashernode
            type=registry,ref=${{ steps.tags.outputs.image }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=stashvideohashernode
            type=registry,ref=${{ steps.tags.outputs.image }}:buildcache,mode=max

  pypi:
    needs: version
    if: github.event_name == 'workflow_dispatch' || needs.version.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.version.outputs.target_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Read package metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_OUTPUT}"
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          name = data["project"]["name"]
          version = data["project"]["version"]

          print(f"name={name}")
          print(f"version={version}")
          PY

      - name: Check if version already exists on PyPI
        id: pypi
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.name }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os
          import urllib.error
          import urllib.request

          name = os.environ["PACKAGE_NAME"]
          version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/{name}/json"

          try:
            with urllib.request.urlopen(url, timeout=15) as response:
              data = json.load(response)
              exists = version in data.get("releases", {})
          except urllib.error.HTTPError as exc:
            if exc.code == 404:
              exists = False
            else:
              raise

          print(f"exists={'true' if exists else 'false'}")
          PY

      - name: Build package
        if: steps.pypi.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish package to PyPI
        if: steps.pypi.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@v1.14.0
