name: Build and publish Python package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  detect-version-change:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.detect.outputs.version_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Detect version change
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          before_sha="${{ github.event.before }}"
          zero_sha="0000000000000000000000000000000000000000"

          if [[ "${before_sha}" == "${zero_sha}" ]]; then
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! git show "${before_sha}:pyproject.toml" > /tmp/pyproject.old 2>/dev/null; then
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          cp pyproject.toml /tmp/pyproject.new
          equal_line="$(python scripts/version_utils.py equal --old-file /tmp/pyproject.old --new-file /tmp/pyproject.new)"

          if [[ "${equal_line}" == "equal=true" ]]; then
            echo "version_changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
          fi

  build-and-publish:
    needs: detect-version-change
    if: github.event_name == 'workflow_dispatch' || needs.detect-version-change.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Read package metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_OUTPUT}"
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          name = data["project"]["name"]
          version = data["project"]["version"]

          print(f"name={name}")
          print(f"version={version}")
          PY

      - name: Check if version already exists on PyPI
        id: pypi
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.name }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_OUTPUT}"
          import json
          import os
          import urllib.error
          import urllib.request

          name = os.environ["PACKAGE_NAME"]
          version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/{name}/json"

          try:
            with urllib.request.urlopen(url, timeout=15) as response:
              data = json.load(response)
              exists = version in data.get("releases", {})
          except urllib.error.HTTPError as exc:
            if exc.code == 404:
              exists = False
            else:
              raise

          print(f"exists={'true' if exists else 'false'}")
          PY

      - name: Build package
        if: steps.pypi.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish package to PyPI
        if: steps.pypi.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@v1.14.0
