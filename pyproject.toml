[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "StashVideoHasherNode"
version = "0.3.4"
description = "Distributed Stash videohasher worker with VAAPI/NVENC/VideoToolbox support."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
dependencies = [
  "stashapp-tools>=0.2.0",
  "Pillow>=9.0.0",
  "numpy>=1.20.0",
  "scipy>=1.7.0",
  "tqdm>=4.60.0",
  "PyYAML>=6.0",
]

[project.scripts]
stash-videohasher = "phash_videohasher_main:main"

[tool.setuptools]
py-modules = ["phash_videohasher_main", "config"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["helpers*"]
